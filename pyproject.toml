[project]
name = "triso-neutronics"
version = "0.1.0"
requires-python = ">=3.12"
description = "TRISO particle fuel neutronics and depletion using OpenMC"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "h5py>=3.11",
    "uncertainties>=3.1",
    "lxml>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triso"]
